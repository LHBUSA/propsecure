<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">PropSecure portfolio surveillance</title>
<desc id="desc">A portfolio surveillance command view showing monitored properties, regional signal clusters, qualified events and delivery routes.</desc>
<defs>
