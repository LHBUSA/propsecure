<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">PropSecure evidence chain</title>
<desc id="desc">A monitored property receives deed, lien, permit and hazard signals that are qualified into one evidence-backed event and routed to an enterprise workflow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06162c"/><stop offset="1" stop-color="#0a2347"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2d59"/><stop offset="1" stop-color="#071a33"/></linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#123c82"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020817" flood-opacity=".42"/></filter>
  <filter id="redglow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#e3263f" flood-opacity=".75"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8fbfff" stroke-opacity=".05"/></pattern>
</defs>
<rect width="1600" height="980" rx="44" fill="url(#bg)"/>
<rect width="1600" height="980" rx="44" fill="url(#grid)"/>
<ellipse cx="800" cy="485" rx="510" ry="410" fill="url(#glow)"/>
<g fill="none" stroke="#5e9cff" stroke-width="3" stroke-opacity=".34" stroke-dasharray="11 14">
  <path d="M350 250C540 285 615 360 690 433"/><path d="M350 730C535 690 620 607 690 540"/><path d="M1250 250C1062 285 980 360 910 433"/><path d="M1250 730C1065 690 980 607 910 540"/>
</g>
<g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
  <g transform="translate(105 150)"><rect width="365" height="170" rx="24" fill="url(#panel)" stroke="#31517b"/><circle cx="48" cy="49" r="10" fill="#60a5fa"/><text x="74" y="55" fill="#9fc6ff" font-size="18" font-weight="800">RECORDED DEED</text><text x="44" y="100" fill="#fff" font-size="28" font-weight="800">Ownership changed</text><text x="44" y="132" fill="#7f9ab9" font-size="17">Official recorder evidence</text></g>
  <g transform="translate(105 660)"><rect width="365" height="170" rx="24" fill="url(#panel)" stroke="#31517b"/><circle cx="48" cy="49" r="10" fill="#e3263f"/><text x="74" y="55" fill="#ff8d9c" font-size="18" font-weight="800">LIEN / DEFAULT</text><text x="44" y="100" fill="#fff" font-size="28" font-weight="800">Collateral impaired</text><text x="44" y="132" fill="#7f9ab9" font-size="17">Filing + source timestamp</text></g>
  <g transform="translate(1130 150)"><rect width="365" height="170" rx="24" fill="url(#panel)" stroke="#31517b"/><circle cx="48" cy="49" r="10" fill="#34d399"/><text x="74" y="55" fill="#87efbf" font-size="18" font-weight="800">PERMIT / MUNICIPAL</text><text x="44" y="100" fill="#fff" font-size="28" font-weight="800">Property activity</text><text x="44" y="132" fill="#7f9ab9" font-size="17">Jurisdiction-scoped signal</text></g>
  <g transform="translate(1130 660)"><rect width="365" height="170" rx="24" fill="url(#panel)" stroke="#31517b"/><circle cx="48" cy="49" r="10" fill="#fbbf24"/><text x="74" y="55" fill="#ffd770" font-size="18" font-weight="800">HAZARD / EXPOSURE</text><text x="44" y="100" fill="#fff" font-size="28" font-weight="800">Risk designation moved</text><text x="44" y="132" fill="#7f9ab9" font-size="17">Parcel-linked context</text></g>
</g>
<g transform="translate(590 290)" filter="url(#shadow)">
  <rect width="420" height="400" rx="42" fill="#071a33" stroke="#4779bd" stroke-width="2"/>
  <circle cx="210" cy="154" r="112" fill="#0c2c57" stroke="#285d9f"/>
  <path d="M210 60 286 88v58c0 53-28 91-76 116-48-25-76-63-76-116V88Z" fill="url(#shield)"/>
  <path d="m176 147 25 25 48-59" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="300" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="850" text-anchor="middle">CANONICAL PROPERTY</text>
  <text x="210" y="336" fill="#8dabcf" font-family="ui-monospace,monospace" font-size="16" font-weight="700" text-anchor="middle">IDENTITY · PARCEL · SOURCE</text>
  <text x="210" y="370" fill="#ff7f8d" font-family="ui-monospace,monospace" font-size="15" font-weight="800" text-anchor="middle">CONTINUOUS WATCH ACTIVE</text>
</g>
<g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
  <g transform="translate(510 792)"><rect width="580" height="114" rx="22" fill="#fff"/><text x="32" y="42" fill="#071a33" font-size="17" font-weight="900">QUALIFIED EVENT CONTRACT</text><text x="32" y="76" fill="#64758e" font-size="18">source + time + property + evidence + rule + route</text><rect x="440" y="24" width="108" height="56" rx="16" fill="#e3263f"/><text x="494" y="59" fill="#fff" font-size="15" font-weight="900" text-anchor="middle">ROUTE →</text></g>
</g>
<g fill="#5e9cff"><circle cx="690" cy="433" r="8"/><circle cx="690" cy="540" r="8"/><circle cx="910" cy="433" r="8"/><circle cx="910" cy="540" r="8"/></g>
</svg>