<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">PropSecure property surveillance illustration</title>
  <desc id="desc">A premium aerial property scene with parcel boundary, security shield, risk signals, and monitoring overlays.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf3ff"/><stop offset="1" stop-color="#b9d4f4"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9df"/><stop offset="1" stop-color="#b7cdb8"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ba9b7"/><stop offset="1" stop-color="#687786"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f6680"/><stop offset="1" stop-color="#23364e"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#d9e2ec"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9fc8f1"/><stop offset="1" stop-color="#416b99"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12499a"/><stop offset="1" stop-color="#061b3d"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#3177df" stop-opacity=".32"/><stop offset="1" stop-color="#3177df" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#071f49" flood-opacity=".25"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#f0182b" flood-opacity=".8"/></filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#0b2e68" stroke-opacity=".06"/></pattern>
